[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-platform"
version = "0.1.0"
description = "Durable, policy-enforced, observable execution of LLM agent workflows over MCP tools, with failure-injection evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Denis Samatov" }]
dependencies = [
  "mcp>=2.3,<3",
  "anyio>=4.4",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "localdesk[baseline]>=0.3.1",
]

[project.optional-dependencies]
# yandex-workspace-mcp as an external, read-only Wiki tool server (ADR-A5); pinned to a commit.
workspace = ["yandex-workspace-mcp @ git+https://github.com/denis-samatov/yandex-workspace-mcp.git@92d9c305e079c313fcf28310ee96d0bce51b5c05"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mcp-capguard @ git+https://github.com/denis-samatov/mcp-capguard.git",
  "agent-reliability-platform[workspace]",
]

[project.scripts]
arp = "arp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a running OpenAI-compatible LLM server (ARP_LLM_BASE_URL)"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
